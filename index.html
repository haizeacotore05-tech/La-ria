<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="El diario de Haizea: las noticias del día de Bilbao, Euskadi, España y el mundo.">
<meta name="theme-color" content="#EDF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1514" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Ría">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>La Ría</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&display=swap">
<style>
/* Layout: masthead con línea de agua → índice de secciones fijo (su filete inferior es la "marea": mezcla de secciones del día) → portada con cifra gigante → En un minuto → cada sección: una destacada + listado uniforme. Barra inferior con 4 vistas. */
:root{
  --paper:#EDF1EF; --paper-2:#E2E8E5; --card:#F7F9F8; --ink:#13201E; --muted:#56655F; --line:#C7D1CD;
  --ria:#0E6B5E; --hierro:#B4271F; --up:#1D7A3A; --down:#B3261E; --sun:#C98A00; --wet:#2C4E8A;
  --s-bilbao:#0E6B5E; --s-euskadi:#3E6A26; --s-espana:#8C5A00; --s-mundo:#2C4E8A;
  --s-italia:#5E6A12; --s-economia:#664A98; --s-cultura:#A0346A; --s-sociedad:#22758A; --s-deportes:#B4271F; --s-ciencia:#7A4E2D;
  --f-mast:"Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-text:"Newsreader", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1514; --paper-2:#16201E; --card:#131C1A; --ink:#E3EAE7; --muted:#97A7A1; --line:#27342F;
  --ria:#4DB5A3; --hierro:#F06A5F; --up:#5CC97E; --down:#F07A70; --sun:#E8B54A; --wet:#7FA3E6;
  --s-bilbao:#4DB5A3; --s-euskadi:#8BBE6A; --s-espana:#E0A847; --s-mundo:#7FA3E6;
  --s-italia:#C3CF6A; --s-economia:#B39BE6; --s-cultura:#E781B2; --s-sociedad:#6BC2D6; --s-deportes:#F06A5F; --s-ciencia:#D49A6A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E1514; --paper-2:#16201E; --card:#131C1A; --ink:#E3EAE7; --muted:#97A7A1; --line:#27342F;
  --ria:#4DB5A3; --hierro:#F06A5F; --up:#5CC97E; --down:#F07A70; --sun:#E8B54A; --wet:#7FA3E6;
  --s-bilbao:#4DB5A3; --s-euskadi:#8BBE6A; --s-espana:#E0A847; --s-mundo:#7FA3E6;
  --s-italia:#C3CF6A; --s-economia:#B39BE6; --s-cultura:#E781B2; --s-sociedad:#6BC2D6; --s-deportes:#F06A5F; --s-ciencia:#D49A6A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-text);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ria);outline-offset:3px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:8px 112px}
.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}

/* Masthead */
.mast{padding-top:10px}
.mast-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted)}
.mast-meta b{color:var(--ink);font-weight:500}
.mast svg{display:block;width:100%;height:auto;margin-top:2px}
.mast .word{font-family:var(--f-mast);font-weight:900}
.wave{animation:drift 9s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-200px)}}
@media (prefers-reduced-motion: reduce){.wave{animation:none}}
.mast-sub{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:8px;margin-top:2px}
.mast-sub em{font-style:italic;color:var(--muted)}

/* Índice de secciones */
.index{position:sticky;top:env(safe-area-inset-top, 0px);z-index:4;background:var(--paper);margin-top:14px;margin-inline:-16px;padding-inline:16px}
.index-row{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.index-row::-webkit-scrollbar{display:none}
.index-row button{flex:none;position:relative;font-family:var(--f-mast);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;padding:13px 14px 12px;color:var(--muted);transition:color .15s}
.index-row button:first-child{padding-left:0}
.index-row button+button::before{content:"";position:absolute;left:0;top:15px;bottom:15px;width:1px;background:var(--line)}
.index-row button:hover{color:var(--ink)}
.index-row button[aria-current="true"]{color:var(--ink)}
.index-row button[aria-current="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;background:var(--sec, var(--ink))}
.index-row button:first-child[aria-current="true"]::after{left:0}
.index-tide{display:flex;height:4px;background:var(--ink)}
.index-tide span{flex-grow:var(--n);background:var(--sec)}
.index-tide.on span{opacity:.22}
.index-tide.on span.hit{opacity:1}

/* Notices */
.note{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--paper-2);font-size:15px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note button{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;text-decoration:underline;text-underline-offset:3px}

/* Cover */
.cover{position:relative;overflow:hidden;background:color-mix(in oklab, var(--sec) 15%, var(--card));color:var(--sec);border-radius:var(--r);aspect-ratio:16/10;max-width:100%}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.fig b.long{zoom:.7}
.fig{position:absolute;left:16px;bottom:12px;right:16px;display:flex;flex-direction:column;line-height:.86}
.fig b{font-family:var(--f-mast);font-weight:900;font-size:clamp(56px,13vw,112px);letter-spacing:-.01em;color:var(--sec);text-shadow:0 0 0 transparent;white-space:nowrap}
.fig span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--card);align-self:flex-start;padding:4px 7px;border-radius:4px;margin-top:6px;line-height:1.2}
.sec-tag{font-family:var(--f-mast);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--sec)}

/* Lead */
.day-line{margin-top:22px;font-size:20px;line-height:1.4;font-style:italic;text-wrap:pretty;max-width:60ch}
.day-line::before{content:"El día en una frase";display:block;font-style:normal;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.lead{display:grid;grid-template-areas:"cover" "head" "body";gap:12px 28px;margin-top:22px;text-align:left;width:100%}
.lead .cover{grid-area:cover}.l-head{grid-area:head;min-width:0}.l-body{grid-area:body;min-width:0}
.lead-ex{display:none;margin:12px 0 0;font-size:17px;line-height:1.55;color:var(--ink);max-width:62ch}
.lead .cover{aspect-ratio:16/11}
.lead .fig b{font-size:clamp(84px,24vw,190px)}
.lead h2{font-size:clamp(28px,6.4vw,44px);line-height:1.08;font-weight:700;margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
.lead p{margin:10px 0 0;font-size:18px;color:var(--muted);max-width:60ch}
.byline{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);margin-top:10px}

/* En un minuto */
.minute{margin-top:34px;background:var(--ink);color:var(--paper);border-radius:var(--r);padding:18px 18px 8px}
.minute h3{margin:0 0 6px;font-family:var(--f-mast);font-weight:900;font-size:30px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.minute-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.minute-top h3{margin:0}
.minute .listen{display:inline-flex;width:auto;padding:8px 14px;line-height:1;font-size:12px}
.listen{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid color-mix(in oklab, var(--paper) 40%, transparent);font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.listen svg{width:14px;height:14px;fill:currentColor}
.listen[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.minute .done{opacity:.5}
.minute .done .kick::after{content:" · leída"}
.minute h3 small{font-family:var(--f-mono);font-size:11px;font-weight:400;letter-spacing:.06em;opacity:.65;margin-left:8px;vertical-align:middle}
.minute ol{list-style:none;margin:0;padding:0}
.minute li+li{border-top:1px solid color-mix(in oklab, var(--paper) 18%, transparent)}
.minute button{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:baseline;text-align:left;width:100%;padding:11px 0;font-size:16.5px;line-height:1.35}
.minute .kick{font-family:var(--f-mast);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in oklab, var(--sec) 60%, var(--paper))}
@media (max-width:420px){.minute button{grid-template-columns:1fr;gap:2px}}

/* Section blocks */
.block{margin-top:40px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:3px solid var(--sec);padding-bottom:6px;margin-bottom:16px}
.block-h h3{margin:0;font-family:var(--f-mast);font-weight:900;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.01em;color:var(--sec)}
.feature{display:grid;gap:14px;text-align:left;width:100%}
.feature h4{margin:4px 0 0;font-size:clamp(23px,5vw,30px);line-height:1.12;font-weight:700;text-wrap:balance}
.feature p{margin:8px 0 0;color:var(--muted);font-size:17px;line-height:1.45;max-width:60ch}
.feature .meta{margin-top:10px}
.feature .fig b{font-size:clamp(60px,15vw,110px)}
.list{display:grid;column-gap:32px;margin-top:6px}
.row{display:grid;grid-template-columns:1fr 76px;gap:14px;align-items:start;text-align:left;width:100%;padding-block:14px;border-top:1px solid var(--line)}
.row h4{margin:2px 0 0;font-size:18.5px;line-height:1.25;font-weight:600;text-wrap:pretty}
.row .cover{aspect-ratio:1;border-radius:10px}
.row .fig{left:6px;right:6px;bottom:4px}
.row .fig b{font-size:22px;white-space:normal;line-height:.95;overflow-wrap:anywhere}
.row .fig span{display:none}
.is-read h4,.is-read h2{color:var(--muted)}
.read-tag{color:var(--ria)}
.feature:hover h4,.row:hover h4,.lead:hover h2{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted)}
.saved-dot{color:var(--hierro)}
@media (min-width:760px){
  .lead{grid-template-areas:"head head" "cover body";grid-template-columns:1.25fr 1fr;align-items:start}
  .lead h2{font-size:clamp(34px,4.6vw,54px)}
  .lead .fig b{font-size:clamp(64px,8vw,130px)}
  .lead-ex{display:block}
  .feature{grid-template-columns:1.1fr 1fr;align-items:center;gap:28px}
  .list{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:1000px){ .list{grid-template-columns:repeat(3,minmax(0,1fr))} }

/* Mercados */
.mkt{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:14px 16px;margin-bottom:22px}
.mkt-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.mkt-top h4{margin:0;font-family:var(--f-mast);font-weight:900;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.mkt-grid{display:grid;grid-template-columns:minmax(0,1fr);column-gap:28px}
@media (min-width:600px){ .mkt-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.mkt-row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.mkt-row b{font-weight:600;font-size:15.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkt-row span{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.mkt-row .up{color:var(--up)} .mkt-row .down{color:var(--down)}
.mkt p{margin:10px 0 4px;font-size:15.5px}
.mkt-src{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mkt-src a{color:inherit}
@media (min-width:1000px){ .mkt-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }

/* Breves */
.briefs{columns:1;column-gap:32px}
.briefs h5{font-family:var(--f-mast);font-weight:900;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--sec);margin:20px 0 0;padding-bottom:4px;border-bottom:2px solid var(--sec);break-after:avoid}
.briefs h5:first-child{margin-top:0}
.brief{break-inside:avoid;padding-block:10px;border-bottom:1px solid var(--line)}
.b-tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sec)}
.brief p{margin:3px 0 4px;font-size:16px;line-height:1.42;text-wrap:pretty}
.brief a{font-family:var(--f-mono);font-size:11px;letter-spacing:.03em;color:var(--muted);text-decoration:none}
.brief a:hover{text-decoration:underline;text-underline-offset:3px}
.block-h.ink{--sec:var(--ink)}
.block-h.ink h3{color:var(--ink)}
@media (min-width:760px){ .briefs{columns:2} }
@media (min-width:1000px){ .briefs{columns:3} }

/* Search / lists */
.view-h{margin:26px 0 6px;font-family:var(--f-mast);font-weight:900;font-size:44px;line-height:1;text-transform:uppercase}
.view-p{margin:0 0 16px;color:var(--muted);max-width:60ch}
.search{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:999px;padding:4px 6px 4px 16px;background:var(--card)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:18px;color:var(--ink);padding:8px 0;outline:none}
.search button{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;padding:8px 10px;color:var(--muted)}
.hits{margin-top:8px}
mark{background:color-mix(in oklab, var(--ria) 28%, transparent);color:inherit;border-radius:3px;padding:0 1px}
.ed-list{display:grid;gap:12px;margin-top:8px}
.ed{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.ed[aria-current="true"]{border-color:var(--ria);box-shadow:inset 0 0 0 1px var(--ria)}
.ed-date{font-family:var(--f-mast);font-weight:900;font-size:44px;line-height:.85;text-align:center;min-width:58px}
.ed-date small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.ed p{margin:4px 0 0;font-size:15px;color:var(--muted);line-height:1.4}
.mini-tide{display:flex;height:6px;border-radius:99px;overflow:hidden;gap:2px;margin-top:8px}
.mini-tide span{flex-grow:var(--n);background:var(--sec)}
.empty{margin-top:30px;padding:28px 20px;border:2px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--f-mast);font-weight:900;font-size:30px;color:var(--ink);text-transform:uppercase;margin-bottom:6px}

/* Bottom bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in oklab, var(--paper) 88%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px))}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-radius:10px}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{stroke:var(--ria);stroke-width:2.2}

/* Sigue la historia */
.thread{margin-top:22px;border-top:3px solid var(--ink);padding-top:12px}
.thread h5{margin:0 0 2px;font-family:var(--f-mast);font-weight:900;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.thread .t-label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sec)}
.thread ol{list-style:none;margin:8px 0 0;padding:0;position:relative}
.thread li{position:relative;padding-left:22px}
.thread li::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--line)}
.thread li::after{content:"";position:absolute;left:1px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--sec)}
.thread li button{display:block;text-align:left;width:100%;padding:12px 0;border-bottom:1px solid var(--line)}
.thread li button b{display:block;font-size:17px;line-height:1.3;font-weight:600}
.thread li button small{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.thread .t-empty{margin:6px 0 0;color:var(--muted);font-size:15px}
.t-chip{color:var(--sec)}
/* La semana */
.minute.week{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.minute.week .kick{color:var(--sec)}
.minute.week li+li{border-top:1px solid var(--line)}
.minute.week .listen{border-color:var(--line)}
.minute.week .listen[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.week-period{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:-2px 0 6px}
.offline{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom, 0px));z-index:6;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}

/* El tiempo */
.wx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.wx-d{display:flex;align-items:center;gap:8px;padding:8px 8px;min-width:0;overflow:hidden}
.wx-d+.wx-d{border-left:1px solid var(--line)}
.wx-d svg{width:28px;height:28px;flex:none;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wx-d svg .sun{stroke:var(--sun);fill:color-mix(in oklab, var(--sun) 35%, transparent)}
.wx-d svg .drop{stroke:var(--wet)}
.wx-t{display:flex;flex-direction:column;line-height:1.1;min-width:0;max-width:100%}
.wx-t b{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.wx-t span{font-family:var(--f-mast);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wx-t span small{font-size:15px;color:var(--muted);font-weight:500}
.wx-t i{font-style:normal;font-family:var(--f-mono);font-size:10.5px;color:var(--wet);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Barra de vista: sin leer + tamaño de letra */

<script>
(() => {
const SECTIONS = [
  ["bilbao","Bilbao"],["euskadi","Euskadi"],["espana","España"],["mundo","Internacional"],["italia","Italia"],
  ["economia","Economía"],["sociedad","Sociedad"],["cultura","Cultura"],["ciencia","Ciencia"],["deportes","Deportes"]
];
const SEC = Object.fromEntries(SECTIONS);
const secOf = s => SEC[s] ? s : "sociedad";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MADRID = "Europe/Madrid";

const state = {
  editions: [],      // sorted desc
  current: null,     // date string
  section: null,
  tab: "hoy",
  query: "",
  saved: [],         // [{id,date}]
  read: [],          // story ids read
  unread: false,     // solo sin leer
  fz: 0,             // tamaño de letra (0,1,2)
  comarca: null,     // filtro del mapa de breves
  missed: [],        // ediciones que no abrió
  loaded: false,
  dbOk: true,
};
let db = null, uid = null, sample = null;
const STANDALONE = !(window.claude && typeof window.claude.use === "function");
const DATA = "data/";
const fullLoading = {};
function ensureFull(date){
  const e = state.editions.find(x => x.date === date);
  if (!e || !e._partial) return Promise.resolve(e);
  if (!fullLoading[date]) fullLoading[date] = fetch(`${DATA}editions/${date}.json`, { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error("no"); return r.json(); })
    .then(full => { const i = state.editions.findIndex(x => x.date === date); if (i >= 0) state.editions[i] = full; return full; })
    .finally(() => { delete fullLoading[date]; });
  return fullLoading[date];
}

/* ---------- dates ---------- */
const todayISO = () => new Intl.DateTimeFormat("en-CA",{timeZone:MADRID,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const dateObj = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d, 12); };
const fmtLong = iso => new Intl.DateTimeFormat("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(dateObj(iso));
const fmtDay = iso => new Intl.DateTimeFormat("es-ES",{day:"numeric"}).format(dateObj(iso));

/* ---------- boot ---------- */
try { const s = JSON.parse(localStorage.getItem("laria.saved") || "[]"); if (Array.isArray(s)) state.saved = s; } catch {}
try { const r = JSON.parse(localStorage.getItem("laria.read") || "[]"); if (Array.isArray(r)) state.read = r; } catch {}
try { state.unread = localStorage.getItem("laria.unread") === "1"; const f = +localStorage.getItem("laria.fz"); if (f >= 0 && f <= 2) state.fz = f; } catch {}
applyFz();
render();

(async () => {
  const timeout = setTimeout(() => { if (!state.loaded) { state.loaded = true; render(); } }, 12000);
  try {
    if (STANDALONE) {
      clearTimeout(timeout);
      try {
        const idx = await fetch(`${DATA}index.json`, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error("no"); return r.json(); });
        state.editions = (idx.editions || []).map(e => ({ ...e, _partial: true }));
        state.current = state.editions[0]?.date || null;
        if (state.current) await ensureFull(state.current).catch(() => {});
        computeMissed();
      } catch {}
      state.loaded = true; render();
      const flag = () => { let el = $("#offline"); if (!navigator.onLine) { if (!el) document.body.insertAdjacentHTML("beforeend", `<div class="offline" id="offline">Sin conexión · leyendo lo guardado</div>`); } else el?.remove(); };
      addEventListener("online", flag); addEventListener("offline", flag); flag();
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
      return;
    }
    claude.use("sample").then(s => { sample = s; if (openKey && s) { const a = $("#ask"); if (a) { a.hidden = false; const st = findStory(openKey.id, openKey.date); $("#ask-btn").onclick = () => askContext(st, openKey.date); } } });
    const user = await claude.use("user");
    uid = user ? await user.id().catch(() => null) : null;
    db = await claude.use("db");
    if (!db) { state.loaded = true; render(); return; }
    db.collection("editions").orderBy("date","desc").limit(400).onSnapshot(snap => {
      clearTimeout(timeout);
      const prevNewest = state.editions[0]?.date;
      state.editions = snap.docs.map(d => d.data()).filter(e => e && e.date && Array.isArray(e.stories) && e.stories.length);
      if (!state.current || state.current === prevNewest || !state.editions.some(e => e.date === state.current)) state.current = state.editions[0]?.date || null;
      computeMissed();
      state.loaded = true; render();
      if (openKey && !$("#reader").hidden && !findStory(openKey.id, openKey.date)) closeReader();
    }, () => { state.loaded = true; render(); });
    if (uid) {
      const snap = await db.doc(`data/users/${uid}/prefs`).get().catch(() => null);
      const remote = snap?.exists ? snap.data()?.saved : null;
      if (Array.isArray(remote)) {
        const merged = [...remote]; state.saved.forEach(s => { if (!merged.some(m => m.id === s.id)) merged.push(s); });
        const changed = merged.length !== remote.length; state.saved = merged; render(); if (changed) persistSaved();
      } else if (state.saved.length) persistSaved();
      const rs = await db.doc(`data/users/${uid}/read`).get().catch(() => null);
      const rr = rs?.exists ? rs.data()?.ids : null;
      if (Array.isArray(rr)) { state.read = [...new Set([...rr, ...state.read])].slice(-2500); render(); }
    }
  } catch { state.loaded = true; render(); }
})();
})();
</script>

</body>
</html>
